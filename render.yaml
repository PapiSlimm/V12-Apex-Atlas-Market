# ---------------------------------------------------------------------------
# V12 Apex Atlas — Render blueprint.
#
# Orion Prime already runs on Render, so Apex Atlas goes beside it. This file
# is the whole deployment: connect the repo, Render reads this, and you approve
# the plan it proposes.
#
# WHAT THIS DELIBERATELY DOES NOT DO
# ----------------------------------
# It does not put a single secret in version control. Everything sensitive is
# either generated by Render (`generateValue`) or marked `sync: false`, which
# means Render prompts you for it once in the dashboard and never stores it
# here. A blueprint that carries secrets is a blueprint that leaks them the
# first time the repo is shared.
#
# Confirm plan names against your Render dashboard before the first apply —
# they change, and a stale plan name fails the apply rather than silently
# picking something else.
# ---------------------------------------------------------------------------

databases:
  - name: apex-atlas-db
    databaseName: apex_atlas
    user: apex
    # `free` exists and is genuinely free, but Render DELETES a free Postgres
    # instance after 30 days. For a closed beta with real invited users that is
    # a scheduled data loss, so this starts on the cheapest paid tier. Downgrade
    # to `free` if you are only smoke-testing.
    plan: basic-256mb
    ipAllowList: []   # No public connections. The web service reaches it internally.

services:
  - type: web
    name: v12-apex-atlas
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free web services sleep after 15 minutes idle. An invited beta tester
    # hitting a 50-second cold start concludes the product is broken, so this
    # is not on the free plan.
    plan: starter
    region: oregon
    branch: main

    # /api/health verifies the audit chain and reports `degraded` if settlement
    # is halted or a hash chain is broken. Render therefore notices tampering,
    # not merely a dead port.
    healthCheckPath: /api/health

    envVars:
      # --- storage ------------------------------------------------------
      # Postgres, not SQLite. Render's filesystem is ephemeral: without this
      # the database is silently discarded on every deploy.
      - key: DATABASE_URL
        fromDatabase:
          name: apex-atlas-db
          property: connectionString
      - key: PGSSL
        value: "true"

      # ONE MANUAL STEP AFTER THE FIRST DEPLOY:
      #
      #   npm run rls:apply -- --connections-are-scoped
      #
      # Turns on Postgres row-level security, so tenant isolation is enforced by
      # the database rather than only by every query being written correctly.
      # Not run automatically at boot: enabling RLS needs table ownership, and a
      # boot-time attempt that fails logs a permission error nobody reads and
      # leaves the operator believing it is on.
      #
      # Render's Postgres gives the application a NON-SUPERUSER owner, which is
      # what makes this work — a superuser bypasses RLS entirely, silently, with
      # every policy still showing as enabled. `rls:apply` says so if it finds
      # itself connected as one.

      - key: NODE_ENV
        value: production

      # --- identity -----------------------------------------------------
      # Generated by Render, never seen by me, never in the repo. Rotating it
      # invalidates every session, which is the correct behaviour.
      - key: JWT_SECRET
        generateValue: true

      # --- closed beta --------------------------------------------------
      - key: INVITE_ONLY
        value: "true"
      # A hard ceiling on organisations, independent of how many codes exist.
      # Over-issuing invites must not be able to exceed the number of accounts
      # you decided to support. Raise it deliberately.
      - key: BETA_MAX_TENANTS
        value: "25"

      # --- inference ----------------------------------------------------
      # Optional. Without it every model-backed feature degrades to a clearly
      # labelled local fallback; nothing pretends to be a model that isn't.
      - key: GEMINI_API_KEY
        sync: false
      # Prices in CENTS per million tokens, from your provider's price list.
      # preflight BLOCKS the deploy if a key is set and these are not, because
      # the alternative default under-counts spend and hands out an unbounded
      # bill on a free beta.
      - key: AI_INPUT_CENTS_PER_MTOK
        sync: false
      - key: AI_OUTPUT_CENTS_PER_MTOK
        sync: false

      # --- ecosystem ----------------------------------------------------
      # Apex Atlas is a MEMBER of the v12 ecosystem, on equal terms with Nexion,
      # V12 OS, Orion Prime and CEOS. It initiates and it receives. What keeps
      # it independent is that it governs its own inbound policy below — not its
      # position in the tree.
      - key: ORION_APP_ID
        value: v12-apex-atlas
      - key: ORION_REALM
        value: v12-ecosystem

      # Inbound. ORION_PUBLIC_KEY unset means the entire inbound surface is
      # disabled, which is the correct state until the contract question with
      # the live estate is settled — see ORION-PRIME.md.
      - key: ORION_PUBLIC_KEY
        sync: false
      # EMPTY MEANS NOBODY. Deny-by-default is this app's own control, not the
      # broker's — set it here, deliberately, one caller at a time.
      - key: ORION_ALLOWED_CALLERS
        sync: false

      # Outbound. This app's OWN private key: it signs with it, never transmits
      # it, and Orion holds only the public half. `sync: false` so it is entered
      # once in the dashboard and never written to the repo. Unset means
      # outbound is disabled rather than half-configured.
      - key: ORION_URL
        sync: false
      - key: ORION_PRIVATE_KEY
        sync: false

      # A peer service, read for liveness only. Independent of the broker path.
      - key: ORION_PRIME_URL
        value: https://orion-prime-wkvl.onrender.com

      # --- deliberately absent ------------------------------------------
      # ADMIN_API_TOKEN is NOT listed. Unset means /api/admin/invites is not
      # mounted at all. That endpoint prints invite codes, which makes it the
      # highest-value target on a free beta. Mint codes from a shell instead:
      #   npm run invite -- mint --label "someone@example.com"
      # Add it here only if you decide you need remote minting, and only with
      # ADMIN_IP_ALLOWLIST set alongside it.
      #
      # ENABLE_DEMO_USERS is NOT listed, and preflight blocks if it is set.
      # Seeded credentials in a live deployment are how demo logins become
      # breaches.
